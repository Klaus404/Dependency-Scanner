services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: dependency-scanner-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: scanner
      RABBITMQ_DEFAULT_PASS: scanner
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dependency-scanner-app
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: scanner
      SPRING_RABBITMQ_PASSWORD: scanner
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
    ports:
      - "8080:8080"

volumes:
  rabbitmq-data:
