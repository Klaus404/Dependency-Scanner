spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  rabbitmq:
    host: localhost
    port: 5672

scanner:
  osv-url: https://api.osv.dev/v1/query
  job-ttl: 30m
  max-dependencies: 500
  async-threads: 4
  scan-queue: dependency-scans
  result-exchange: dependency-scan-results
